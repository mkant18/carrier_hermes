services:
  # ── Commander ────────────────────────────────────────────────────────────
  chief_of_staff:
    image: carrier-bot
    container_name: carrier-chief_of_staff
    volumes:
      - C:/Users/micha/carrier_hermes:/repo:ro
      - C:/Users/micha/AppData/Local/hermes/profiles/chief_of_staff/_agent:/profile:rw
    networks:
      - carrier-fleet
    environment:
      HERMES_BOT_ID: chief_of_staff
      HERMES_PROFILE: chief_of_staff
      CARRIER_PEERS_BROKER_URL: http://host.docker.internal:9876
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G
        reservations:
          memory: 1G
    restart: unless-stopped

