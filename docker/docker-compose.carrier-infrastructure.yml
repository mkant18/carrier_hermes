services:
  # ── Carrier Peers Broker ─────────────────────────────────────────────────
  # Inter-bot messaging and task routing
  carrier-peers-broker:
    image: python:3.11-slim-bookworm
    container_name: carrier-peers-broker
    ports:
      - "9876:9876"
    volumes:
      - C:/Users/micha/carrier_hermes:/repo:ro
    networks:
      - carrier-fleet
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      python -c "
      import http.server, json, threading, time, queue
      from urllib.parse import urlparse

      messages = queue.Queue(maxsize=10000)
      subscribers = {}

      class Handler(http.server.BaseHTTPRequestHandler):
          def log_message(self, fmt, *args): pass
          def do_POST(self):
              length = int(self.headers.get('Content-Length', 0))
              body = json.loads(self.rfile.read(length) or b'{}')
              path = self.path
              if path == '/publish':
                  messages.put(body)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{\"ok\":true}')
              elif path == '/subscribe':
                  sid = body.get('subscriber_id', 'anon')
                  # Deliver pending messages for this subscriber
                  pending = []
                  while not messages.empty():
                      try: pending.append(messages.get_nowait())
                      except: break
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'messages': pending}).encode())
              elif path == '/register':
                  sid = body.get('bot_id', 'unknown')
                  subscribers[sid] = {'registered_at': time.time(), **body}
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(json.dumps({'ok': True, 'registered': sid}).encode())
              else:
                  self.send_response(404)
                  self.end_headers()
          def do_GET(self):
              if self.path == '/health':
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'ok', 'subscribers': list(subscribers.keys())}).encode())
              else:
                  self.send_response(404)
                  self.end_headers()

      server = http.server.HTTPServer(('0.0.0.0', 9876), Handler)
      print('Carrier Peers Broker listening on :9876', flush=True)
      server.serve_forever()
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Carrier Viking Server ─────────────────────────────────────────────────
  # Distributed memory / vector store server
  carrier-viking-server:
    image: python:3.11-slim-bookworm
    container_name: carrier-viking-server
    ports:
      - "1933:1933"
    volumes:
      - C:/Users/micha/carrier_hermes:/repo:ro
      - carrier-viking-data:/data
    networks:
      - carrier-fleet
    environment:
      PYTHONUNBUFFERED: "1"
      VIKING_DATA_DIR: /data
    command: >
      sh -c "pip install -q flask && python -c \"
      import json, time, os, uuid
      from pathlib import Path
      from flask import Flask, request, jsonify

      app = Flask('viking')
      DATA = Path(os.environ.get('VIKING_DATA_DIR', '/data'))
      DATA.mkdir(parents=True, exist_ok=True)
      store = {}  # in-memory fallback

      @app.route('/health')
      def health(): return jsonify({'status': 'ok', 'entries': len(store)})

      @app.route('/store', methods=['POST'])
      def store_entry():
          body = request.json or {}
          eid = body.get('id', str(uuid.uuid4()))
          store[eid] = {'id': eid, 'data': body.get('data'), 'ts': time.time(), 'tags': body.get('tags', [])}
          return jsonify({'ok': True, 'id': eid})

      @app.route('/retrieve/<eid>')
      def retrieve(eid): return jsonify(store.get(eid, {'error': 'not found'}))

      @app.route('/search')
      def search():
          tag = request.args.get('tag', '')
          results = [v for v in store.values() if tag in v.get('tags', [])]
          return jsonify({'results': results[:50]})

      print('Viking server on :1933', flush=True)
      app.run(host='0.0.0.0', port=1933)
      \""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1933/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OB1 Brain MCP Server ──────────────────────────────────────────────────
  # Semantic search / long-term memory MCP server
  ob1-brain:
    image: python:3.11-slim-bookworm
    container_name: carrier-ob1-brain
    volumes:
      - C:/Users/micha/carrier_hermes:/repo:ro
      - carrier-ob1-data:/data
    networks:
      - carrier-fleet
    environment:
      PYTHONUNBUFFERED: "1"
      OB1_DATA_DIR: /data
    command: >
      sh -c "pip install -q flask && python /repo/scripts/start_ob1_brain.py"
    restart: unless-stopped

  # ── Carrier Webhook Receiver ──────────────────────────────────────────────
  # Receives webhooks from Discord, GitHub, external services
  carrier-webhook:
    image: python:3.11-slim-bookworm
    container_name: carrier-webhook
    ports:
      - "8800:8800"
    volumes:
      - C:/Users/micha/carrier_hermes:/repo:ro
      - C:/Users/micha/AppData/Local/hermes:/hermes:rw
    networks:
      - carrier-fleet
    environment:
      PYTHONUNBUFFERED: "1"
      HERMES_HOME: /hermes
    command: >
      python -c "
      import http.server, json, sqlite3, time, uuid, os, hmac, hashlib
      from pathlib import Path
      from urllib.parse import urlparse

      HERMES_HOME = Path(os.environ.get('HERMES_HOME', '/hermes'))
      APPROVALS_DB = HERMES_HOME / 'carrier' / 'approvals.db'

      class Handler(http.server.BaseHTTPRequestHandler):
          def log_message(self, fmt, *args): pass
          def do_POST(self):
              length = int(self.headers.get('Content-Length', 0))
              body = json.loads(self.rfile.read(length) or b'{}')
              path = self.path

              if path == '/webhook/discord/interactions':
                  # Handle Discord button interaction webhooks
                  ctype = body.get('type', 0)
                  if ctype == 3:  # COMPONENT interaction
                      custom_id = body.get('data', {}).get('custom_id', '')
                      if custom_id.startswith('approve_') or custom_id.startswith('deny_'):
                          approved = custom_id.startswith('approve_')
                          aid = custom_id[8:] if approved else custom_id[5:]
                          user = body.get('member', {}).get('user', {}).get('username', 'discord')
                          if APPROVALS_DB.exists():
                              conn = sqlite3.connect(str(APPROVALS_DB))
                              conn.execute(
                                  \"UPDATE approvals SET status=?, resolved_at=?, resolved_by=? WHERE id=? AND status='pending'\",
                                  ('approved' if approved else 'denied', time.time(), user, aid)
                              )
                              conn.commit()
                              conn.close()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'type': 6}).encode())  # deferred ACK

              elif path == '/health':
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"ok\"}')
              else:
                  self.send_response(404)
                  self.end_headers()
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'{\"status\":\"carrier-webhook-ok\"}')

      server = http.server.HTTPServer(('0.0.0.0', 8800), Handler)
      print('Carrier webhook on :8800', flush=True)
      server.serve_forever()
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  carrier-fleet:
    name: carrier-fleet
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  carrier-viking-data:
    name: carrier-viking-data
  carrier-ob1-data:
    name: carrier-ob1-data
